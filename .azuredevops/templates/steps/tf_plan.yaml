---

parameters:
  - name: tfCommandOptions
    type: string
    default: ''

steps:
  - template: tf_init.yaml

  - task: TerraformTaskV4@4
    continueOnError: false
    displayName: Terraform Validate
    inputs:
      provider: azurerm
      command: validate
      workingDirectory: $(TF_DIRECTORY)

  - task: Bash@3
    displayName: Print Terraform runtime variables before Plan
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        echo "=== Terraform runtime variables before Plan ==="
        echo "TF_VERSION: $(TF_VERSION)"
        echo "TF_DIRECTORY: $(TF_DIRECTORY)"
        echo "SERVICE_CONNECTION: $(SERVICE_CONNECTION)"
        echo "TF_VAR_TARGET_SUBSCRIPTION_ID: $(TF_VAR_TARGET_SUBSCRIPTION_ID)"
        echo "=============================================="

  - task: TerraformTaskV4@4
    name: TerraformPlan
    displayName: Terraform Plan - $(ENVIRONMENT) environment
    continueOnError: false

    inputs:
      provider: azurerm
      command: plan
      workingDirectory: $(TF_DIRECTORY)
      commandOptions: -input=false -var-file=$(tfVarsFile) ${{ parameters.tfCommandOptions }} -out=$(Build.ArtifactStagingDirectory)/$(ENVIRONMENT).tfplan
      environmentServiceNameAzureRM: $(SERVICE_CONNECTION)

  - task: PublishBuildArtifacts@1
    displayName: Publish Artifact
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)
      ArtifactName: $(TF_PLAN_ARTIFACT)
      publishLocation: Container
